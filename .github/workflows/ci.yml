name: CI Quality Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # ==========================================
  # 1. VALIDAÇÃO DO FRONTEND (Node / React / TS)
  # ==========================================
  frontend-check:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do Frontend
        run: |
          cd frontend
          npm install

      - name: Executar Linter (Oxlint)
        run: |
          cd frontend
          npm run lint

      - name: Validar Build e Tipagem (TypeScript + Vite)
        run: |
          cd frontend
          npm run build

  # ==========================================
  # 2. VALIDAÇÃO DO BACKEND (PHP / Laravel)
  # ==========================================
  backend-check:
    name: Backend (Tests & Syntax)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar PHP 8.3 e Extensões
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, zip
          coverage: none

      - name: Instalar dependências do Composer
        run: |
          cd backend
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Preparar ambiente de testes (.env.testing)
        run: |
          cd backend
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate --env=testing

      - name: Executar Testes Automatizados (PHPUnit)
        run: |
          cd backend
          php artisan test
